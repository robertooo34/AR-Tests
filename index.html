<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pico AR Spinner</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    // WICHTIG: exakt dein Topic aus dem Pico-Code (ohne das b davor)
    const TOPIC = "bachelor-test-projekt-27102026/pico-ar/distanz";
    const MAX_DIST = 100;  // cm: ab hier fängt das Drehen an
    const MAX_SPEED = 500; // Grad pro Sekunde bei Distanz 0

    let target = 0, lastMsg = 0, testMode = false;

    function setStatus(text) {
      const el = document.getElementById("debug");
      if (el) el.textContent = text;
    }

    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", () => {
      setStatus("MQTT verbunden, warte auf Daten...");
      client.subscribe(TOPIC, (err) => {
        if (err) setStatus("Subscribe-Fehler: " + err.message);
      });
    });
    client.on("error", (e) => setStatus("MQTT-Fehler: " + e.message));
    client.on("close", () => setStatus("MQTT getrennt, versuche erneut..."));

    client.on("message", (topic, msg) => {
      const d = parseFloat(msg.toString());
      lastMsg = performance.now();
      target = (d > 0 && d < MAX_DIST) ? MAX_SPEED * (1 - d / MAX_DIST) : 0;
      setStatus("d = " + d + " cm  |  Speed " + Math.round(target));
    });

    AFRAME.registerComponent("spinner", {
      init() { this.speed = 0; },
      tick(time, dt) {
        let t = target;
        if (performance.now() - lastMsg > 1000) t = 0; // keine Daten = Stillstand
        if (testMode) t = MAX_SPEED / 2;               // Testmodus per Antippen
        this.speed += (t - this.speed) * Math.min(1, dt / 200); // Glättung
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.speed) * dt / 1000;
      }
    });

    window.addEventListener("load", () => {
      document.body.addEventListener("click", () => {
        testMode = !testMode;
        if (testMode) setStatus("TESTMODUS an (nochmal tippen = aus)");
      });
    });
  </script>
</head>
<body style="margin:0; overflow:hidden;">
  <div id="debug" style="position:fixed;top:0;left:0;z-index:999;color:#fff;background:rgba(0,0,0,.7);padding:6px;font:14px monospace">verbinde...</div>

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity spinner>
        <a-box position="0 0.5 0" scale="1 1 1" color="#4CC3D9"></a-box>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
