<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pico AR Spinner</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    const TOPIC = "robert-uni-ar-58213/distanz"; // DEIN Topic, exakt wie im Pico-Code
    const MAX_DIST = 100;  // cm: ab hier fängt das Drehen an
    const MAX_SPEED = 720; // Grad pro Sekunde bei Distanz 0

    let target = 0, lastMsg = 0;

    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
    client.on("connect", () => client.subscribe(TOPIC));
    client.on("message", (topic, msg) => {
      const d = parseFloat(msg.toString());
      lastMsg = performance.now();
      target = (d > 0 && d < MAX_DIST) ? MAX_SPEED * (1 - d / MAX_DIST) : 0;
    });

    AFRAME.registerComponent("spinner", {
      init() { this.speed = 0; },
      tick(time, dt) {
        if (performance.now() - lastMsg > 1000) target = 0; // keine Daten = Stillstand
        this.speed += (target - this.speed) * Math.min(1, dt / 200); // Glättung
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.speed) * dt / 1000;
      }
    });
  </script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity spinner>
        <a-entity gltf-model="https://cdn.aframe.io/examples/ar/models/triceratops/scene.gltf" 
                position="0 0 0" scale="0.5 0.5 0.5"></a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
